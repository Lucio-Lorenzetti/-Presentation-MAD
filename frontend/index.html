<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MAD — Sistema de Gestión Inmobiliario</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Tangerine:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
    <script>
      // Antes de pintar nada: si ya eligió modo oscuro, lo aplicamos ya (si no,
      // se ve un flash claro→oscuro apenas carga React).
      try {
        if (localStorage.getItem('mad_tema') === 'oscuro') document.documentElement.classList.add('dark');
      } catch { /* sin storage */ }
    </script>
  </head>
  <body class="bg-warm-50 text-stone-800 antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
